# Deploy do Next via CLI da Vercel (opcional).
#
# Se o projeto já está ligado ao GitHub em vercel.com (recomendado), a Vercel
# faz o deploy sozinha — este workflow fica redundante e falhava no passo
# "Deploy to production" quando os secrets não batiam com o projeto.
#
# Para ativar este job: GitHub → Settings → Secrets and variables → Actions
# → Variables → crie `ENABLE_VERCEL_CLI_DEPLOY` = `true` e configure
# `VERCEL_TOKEN`, `VERCEL_ORG_ID`, `VERCEL_PROJECT_ID` em Secrets.
#
# Previews de PR na Vercel continuam pelo painel da Vercel (Git integration).
# Opcional: ENABLE_CSP_REPORT_ONLY=1 — CSP Report-Only e POST /api/security/csp-report.
# Sentry: na Vercel, `NEXT_PUBLIC_SENTRY_DSN` (+ source maps opcionais).

name: Deploy web to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web-vercel.yml"

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.ENABLE_VERCEL_CLI_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project (CI only)
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy to production
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
