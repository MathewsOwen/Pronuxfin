name: CodeQL

# Análise estática segurança (JavaScript + TypeScript) em todo o repositório.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "52 13 * * 4"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.4
