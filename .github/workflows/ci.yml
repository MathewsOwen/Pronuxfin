name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (critical)
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          API_URL: http://127.0.0.1:5999
          JWT_SECRET: ci-build-placeholder-jwt-secret-min-32-characters
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          ENABLE_CSP_REPORT_ONLY: "1"
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pronuxfin_test
        ports:
          - 5432:5432
        # Quote the whole command: unquoted `-d pronuxfin_test` is parsed by `docker run` as detach (-d).
        options: >-
          --health-cmd "pg_isready -U postgres -d pronuxfin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pronuxfin_test
      JWT_SECRET: ci-placeholder-jwt-secret-min-32-characters-long
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (critical)
        run: npm audit --audit-level=critical

      - name: Lint (check only)
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations (igual a produção)
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image (smoke, no registry push)
        run: docker build -t pronuxfin-api:ci ./backend

  npm-audit-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dev dependencies
        run: npm ci

      - name: npm audit (critical)
        run: npm audit --audit-level=critical
