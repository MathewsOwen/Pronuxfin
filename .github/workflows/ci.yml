name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify .env.example templates (Fase 0)
        run: node scripts/verify-env.mjs

      - name: Repo hygiene (strict)
        run: node scripts/repo-hygiene.mjs --strict

  web:
    needs: quality-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (types for ESLint/tsc before build)
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma generate --schema prisma/schema.prisma

      - name: npm audit (critical)
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        env:
          API_URL: http://127.0.0.1:5999
          JWT_SECRET: ci-build-placeholder-jwt-secret-min-32-characters
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          ENABLE_CSP_REPORT_ONLY: "1"
        run: npm run build

  web-e2e:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: true
      PLAYWRIGHT_E2E: "1"
      API_URL: http://127.0.0.1:5999
      JWT_SECRET: ci-e2e-placeholder-jwt-secret-min-32-characters
      JWT_ALGORITHM: RS256
      JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n-----END PUBLIC KEY-----"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      INTERNAL_API_SECRET: ci-e2e-internal-api-secret-32chars!
      COOKIE_SAMESITE_STRICT: "1"
      AI_KEYS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      WEBAUTHN_RP_ID: 127.0.0.1
      WEBAUTHN_ORIGIN: https://127.0.0.1
      OPENAI_API_KEY: sk-ci-e2e-placeholder
      CSP_MODE: report-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: E2E (Playwright)
        run: npm run test:e2e

  backend:
    needs: quality-gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pronuxfin_test
        ports:
          - 5432:5432
        # Quote the whole command: unquoted `-d pronuxfin_test` is parsed by `docker run` as detach (-d).
        options: >-
          --health-cmd "pg_isready -U postgres -d pronuxfin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pronuxfin_test
      JWT_SECRET: ci-placeholder-jwt-secret-min-32-characters-long
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (required before ESLint sees Prisma types)
        run: npx prisma generate

      - name: npm audit (critical)
        run: npm audit --audit-level=critical

      - name: Lint (check only)
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      - name: Apply migrations (igual a produção)
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  backend-docker:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image (smoke, no registry push)
        run: docker build -t pronuxfin-api:ci ./backend

  npm-audit-root:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dev dependencies
        run: npm ci

      - name: npm audit (critical)
        run: npm audit --audit-level=critical
